<article
  class="resource-card"
  data-resource-card
  data-name="<%= resource.name %>"
  data-category="<%= resource.category %>"
  data-access="<%= resource.access %>"
  data-search="<%= `${resource.name} ${resource.category} ${resource.description} ${resource.bestFor} ${resource.skills}` %>"
>
  <div class="d-flex justify-content-between align-items-start gap-2">
    <span class="resource-logo" aria-hidden="true"><%= resource.icon %></span>
    <button
      class="favorite-button"
      type="button"
      data-favorite="<%= resource.name %>"
      aria-label="Save <%= resource.name %>"
      aria-pressed="false"
    >
      <i class="bi bi-bookmark" aria-hidden="true"></i>
    </button>
  </div>
  <div class="d-flex flex-wrap align-items-center gap-2 mt-3">
    <span
      class="resource-access resource-access--<%= resource.access.toLowerCase().replace(/[^a-z]+/g, '-') %>"
      ><%= resource.access %></span
    >
    <span class="resource-category"
      ><%= categories.find((category) => category.slug ===
      resource.category).name %></span
    >
  </div>
  <h3 class="h5 mt-3 mb-2"><%= resource.name %></h3>
  <p class="resource-description"><%= resource.description %></p>
  <p class="resource-best">
    <strong>Best for:</strong> <%= resource.bestFor %>
  </p>
  <a
    class="btn btn-sm btn-coral resource-visit"
    href="<%= resource.url %>"
    target="_blank"
    rel="noopener noreferrer"
    data-resource-link="<%= resource.name %>"
    >Visit website
    <i class="bi bi-box-arrow-up-right ms-1" aria-hidden="true"></i
  ></a>
</article>
