{% extends "base.html" %}

{% block title %}Register — OPES EDGE{% endblock %}

{% block content %}

<section class="py-5" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="bi bi-person-plus" style="font-size: 2.5rem;"></i>
                <h3 class="fw-bold mt-2 mb-0">Join OPES EDGE</h3>
                <p class="mb-0 opacity-75">Create your free account today</p>
            </div>
            <div class="auth-body">
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="full_name" class="form-label">Full Name</label>
                        <input type="text" class="form-control form-control-lg" id="full_name" name="full_name" placeholder="Your full name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Create a strong password" required>
                    </div>
                    <div class="mb-4">
                        <label for="role" class="form-label">I am a</label>
                        <select class="form-select form-select-lg" id="role" name="role">
                            <option value="citizen" selected>Citizen / Community Member</option>
                            <option value="farmer">Farmer</option>
                            <option value="student">Student</option>
                            <option value="patient">Patient / Healthcare User</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label small text-muted" for="terms">
                            I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> and <a href="#" class="text-decoration-none">Privacy Policy</a>.
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary-brand w-100 btn-lg">
                        <i class="bi bi-rocket-takeoff me-2"></i>Create Account
                    </button>
                </form>
                
                <hr class="my-4">
                
                <p class="text-center text-muted mb-0">
                    Already have an account? 
                    <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold text-primary-brand">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</section>

{% endblock %}
