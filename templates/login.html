{% extends "base.html" %}

{% block title %}Login — OPES EDGE{% endblock %}

{% block content %}

<section class="py-5" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="bi bi-box-arrow-in-right" style="font-size: 2.5rem;"></i>
                <h3 class="fw-bold mt-2 mb-0">Welcome Back</h3>
                <p class="mb-0 opacity-75">Sign in to your OPES EDGE account</p>
            </div>
            <div class="auth-body">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label small text-muted" for="remember">Remember me</label>
                        </div>
                        <a href="#" class="small text-decoration-none text-primary-brand">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary-brand w-100 btn-lg">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                    </button>
                </form>
                
                <hr class="my-4">
                
                <p class="text-center text-muted mb-0">
                    Don't have an account? 
                    <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold text-primary-brand">Create one</a>
                </p>
            </div>
        </div>
    </div>
</section>

{% endblock %}
